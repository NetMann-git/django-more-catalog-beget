<!-- apps/users/templates/users/password_reset_complete.html -->
{% extends 'users/auth_base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" type="text/css" href="{% static 'users/css/auth.css' %}">
{% endblock %}

{% block title %}Пароль изменён{% endblock %}

{% block content %}
<div class="auth-container" style="text-align: center;">
    <h2>✅ Пароль успешно изменён</h2>
    <p style="color: #666; margin: 20px 0;">
        Теперь вы можете войти в систему с новым паролем.
    </p>
    <a href="{% url 'users:login' %}" class="btn-primary" style="display: inline-block; text-decoration: none; text-align: center;">
        Войти
    </a>
</div>
{% endblock %}
